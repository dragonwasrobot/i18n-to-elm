name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        version-type: strict
        version-file: mise.toml

    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Run formatter
      run: mix format --check-formatted

    - name: Run linter
      run: mix credo --strict

    - name: Run static analysis
      run: mix dialyzer

    - name: Run tests
      run: mix test

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Run web component JS tests
      run: node --test priv/web-component/test/i18n-text.test.js
